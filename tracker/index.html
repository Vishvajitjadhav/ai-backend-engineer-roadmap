<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Career Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@600;700;800&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom dock on phones; a dark "forge" hero sits on top of a calm working surface. */
:root{
  --bg:#F5F3F8; --surface:#FFFFFF; --surface-2:#EFECF4; --line:#E1DCE9; --fg:#1C1622; --muted:#685F74;
  --ember:#E8501A; --ember-2:#FF8A3D; --ember-ink:#FFFFFF; --gold:#A56F00; --gold-bg:#FFF1CC;
  --mint:#0B8F69; --mint-bg:#DDF6EC; --sky:#2B5FE0; --sky-bg:#E3EBFF; --rose:#D93A45; --rose-bg:#FDE4E6;
  --hero-bg:#1A1220; --hero-2:#2A1830; --hero-fg:#FFF5EE; --hero-muted:#CDB8C9;
  --shadow:0 1px 2px rgba(28,22,34,.06),0 8px 24px -12px rgba(28,22,34,.18);
  --ring:0 0 0 3px rgba(232,80,26,.35);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110D14; --surface:#1A1520; --surface-2:#231C2A; --line:#33293C; --fg:#F4EEF6; --muted:#A99DB4;
  --ember:#FF6A2B; --ember-2:#FFA05A; --ember-ink:#1A0E08; --gold:#FFC23D; --gold-bg:#3A2C0C;
  --mint:#3AD6A6; --mint-bg:#0F3328; --sky:#7FA4FF; --sky-bg:#1A2550; --rose:#FF7178; --rose-bg:#40161C;
  --hero-bg:#1E1224; --hero-2:#2E1530; --hero-fg:#FFF5EE; --hero-muted:#CDB8C9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --ring:0 0 0 3px rgba(255,106,43,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110D14; --surface:#1A1520; --surface-2:#231C2A; --line:#33293C; --fg:#F4EEF6; --muted:#A99DB4;
  --ember:#FF6A2B; --ember-2:#FFA05A; --ember-ink:#1A0E08; --gold:#FFC23D; --gold-bg:#3A2C0C;
  --mint:#3AD6A6; --mint-bg:#0F3328; --sky:#7FA4FF; --sky-bg:#1A2550; --rose:#FF7178; --rose-bg:#40161C;
  --hero-bg:#1E1224; --hero-2:#2E1530; --hero-fg:#FFF5EE; --hero-muted:#CDB8C9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --ring:0 0 0 3px rgba(255,106,43,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell — sticky top bar with nav; XP runs along its bottom edge; phones use a bottom dock */
.app{min-height:100%}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topnav-in{max-width:1320px;margin:0 auto;height:64px;display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#FF6A2B,#FFC23D);color:#1A0E08}
.brand .logo svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);font-size:15px;letter-spacing:.02em;line-height:1.1;display:block}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.topnav .nav{display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
.nav-btn{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:10px;border:0;background:none;font-weight:650;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav-btn svg{width:18px;height:18px;flex:none}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.xpline{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.xpline>i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));box-shadow:0 0 12px var(--ember);border-radius:0 3px 3px 0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:18px}
.lvl{font-family:var(--f-display);font-size:12px;padding:7px 10px;border-radius:10px;background:var(--fg);color:var(--bg);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.lvl .xptext{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--bg);opacity:.7}
.bar{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ember),var(--ember-2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.mint>i{background:var(--mint)} .bar.sky>i{background:var(--sky)} .bar.gold>i{background:var(--gold)} .bar.rose>i{background:var(--rose)}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn svg{width:19px;height:19px}
.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--ember);color:var(--ember-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.streak{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.streak.on{border-color:var(--ember);color:var(--ember)}
.streak svg{width:18px;height:18px}

.dock{display:none}
@media (max-width:1240px){.lvl .xptext{display:none}}
@media (max-width:1080px){.brand small{display:none}.topnav .nav .nav-btn span{display:none}.topnav .nav .nav-btn{padding:9px 12px}}
@media (max-width:900px){
  .topnav .nav{display:none}
  .tools{margin-left:auto;gap:6px}
  .main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .dock{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
  .dock .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;justify-content:center;align-items:center}
  .dock .nav-btn[aria-current="page"]{background:var(--surface-2);color:var(--ember)}
}
@media (max-width:520px){.brand>span:last-child{display:none}.icon-btn{width:38px;height:38px}.streak{padding:7px 9px}}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.pad-lg{padding:22px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-h .grow{flex:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:650;text-decoration:none;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn svg{width:16px;height:16px}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.E{background:var(--mint-bg);color:var(--mint)} .pill.M{background:var(--gold-bg);color:var(--gold)} .pill.H{background:var(--rose-bg);color:var(--rose)}
.pill.P0{background:var(--rose-bg);color:var(--rose)} .pill.P1{background:var(--gold-bg);color:var(--gold)} .pill.P2{background:var(--sky-bg);color:var(--sky)}
.pill.ember{background:var(--ember);color:var(--ember-ink)}
.pill.mint{background:var(--mint-bg);color:var(--mint)} .pill.sky{background:var(--sky-bg);color:var(--sky)} .pill.gold{background:var(--gold-bg);color:var(--gold)} .pill.rose{background:var(--rose-bg);color:var(--rose)}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
::placeholder{color:var(--muted);opacity:.65}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ember);box-shadow:var(--ring)}
label.field{display:grid;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}

/* checks */
.check{display:flex;align-items:flex-start;gap:11px;padding:8px 6px;border-radius:9px;cursor:pointer;user-select:none;transition:background .15s}
.check:hover{background:var(--surface-2)}
.box{flex:none;width:21px;height:21px;margin-top:1px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:all .2s cubic-bezier(.2,.9,.3,1.4);background:var(--surface)}
.box svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:all .2s}
.check.on .box{background:var(--c,var(--ember));border-color:var(--c,var(--ember));color:var(--ember-ink)}
.check.on .box svg{opacity:1;transform:scale(1)}
.check.on .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.check .lbl{flex:1;min-width:0}
.check .xp{font-size:11px;font-weight:700;color:var(--muted);opacity:.8;white-space:nowrap;padding-top:2px}
.check.auto{cursor:default}
.check.auto:hover{background:none}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(120% 120% at 85% 110%,#7A2414 0%,transparent 55%),linear-gradient(160deg,var(--hero-2),var(--hero-bg) 60%);color:var(--hero-fg);padding:30px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero{padding:22px}}
.hero .eyebrow{color:#FFB287}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.4vw,52px);line-height:1.02;letter-spacing:-.01em;margin:10px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FF7A30,#FFC23D);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--hero-muted);max-width:52ch;margin:0}
.hero .target{display:inline-flex;gap:8px;align-items:center;margin-top:16px;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:650;font-size:13.5px}
.hero .target svg{width:18px;height:18px;flex:none;color:#FFB287}
.hero .btn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--hero-fg)}
.hero .btn.primary{background:linear-gradient(90deg,#FF6A2B,#FF9440);border-color:transparent;color:#1A0E08}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
@media (max-width:560px){.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hs{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.hs b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.hs span{font-size:11.5px;color:var(--hero-muted)}
.daydial{justify-self:center;position:relative;width:min(250px,70vw);aspect-ratio:1;max-width:100%}
.daydial svg{width:100%;height:100%;transform:rotate(-90deg)}
.daydial .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.daydial .c b{font-family:var(--f-display);font-size:clamp(44px,7vw,64px);line-height:1;display:block}
.daydial .c span{font-size:12px;color:var(--hero-muted);letter-spacing:.1em;text-transform:uppercase}
.daydial .c i{font-style:normal;display:block;margin-top:6px;font-weight:700;color:#FFC23D;font-size:13px}

/* quest */
.quest{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .12s}
.qrow:hover{border-color:var(--muted)}
.qrow.on{background:var(--surface-2)}
.qrow.on .qt{text-decoration:line-through;color:var(--muted)}
.qmin{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:5px 8px;border-radius:8px;background:var(--surface-2);white-space:nowrap}
.qt{font-weight:700}
.qs{font-size:13px;color:var(--muted)}
.qs a{color:var(--ember);font-weight:650}

/* meters */
.meter{display:grid;gap:7px}
.meter .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13.5px}
.meter .top b{font-variant-numeric:tabular-nums}

/* journey */
.trail{position:relative;margin:4px auto 0;max-width:760px}
.trail>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;text-align:center;width:min(170px,34%);text-decoration:none;color:inherit}
.orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:800;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);position:relative;transition:transform .2s}
.node:hover .orb{transform:scale(1.07)}
.orb svg.ring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg)}
.node.done .orb{background:var(--mint);border-color:var(--mint);color:var(--ember-ink)}
.node.now .orb{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,43,.55)}70%{box-shadow:0 0 0 18px rgba(255,106,43,0)}100%{box-shadow:0 0 0 0 rgba(255,106,43,0)}}
.node .nt{font-weight:750;font-size:13.5px;line-height:1.25}
.node .nd{font-size:11.5px;color:var(--muted)}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:15px;height:15px;color:var(--line)}
.stars svg.on{color:var(--gold)}

/* week */
.wk-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
@media (max-width:700px){.wk-head{grid-template-columns:auto minmax(0,1fr)}.wk-head .ringbox{grid-column:1/-1;justify-self:start}}
.wk-num{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;color:var(--ember)}
.wk-num small{display:block;font-size:11px;letter-spacing:.14em;color:var(--muted);font-family:var(--f-body);font-weight:700}
.wk-title{font-family:var(--f-display);font-size:clamp(20px,3vw,30px);font-weight:700;line-height:1.15}
.qcard{border-top:4px solid var(--c)}
.qcard .card-h svg{width:20px;height:20px;color:var(--c)}
.boss{background:linear-gradient(135deg,var(--rose-bg),var(--surface) 60%);border-color:color-mix(in srgb,var(--rose) 40%,var(--line))}
.hp{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--rose)}
.proof{margin-top:10px;padding:12px;border-radius:11px;background:var(--surface-2);font-size:13.5px}
.proof b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.mini-p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.mini-p:first-child{border-top:0}
.mini-p .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mini-p .nm:hover{color:var(--ember)}

/* rep counter */
.reps{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.reps button{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--muted)}
.reps button:hover{background:var(--surface-2);color:var(--fg)}
.reps button.plus{background:var(--ember);color:var(--ember-ink)}
.reps button.plus:hover{filter:brightness(1.08);background:var(--ember)}
.reps b{min-width:30px;text-align:center;font-family:var(--f-mono);font-size:14px}
.reps.big button{width:44px;height:44px;font-size:22px}
.reps.big b{min-width:48px;font-size:20px}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--mint)}
.pips i.on.l2{background:var(--sky)} .pips i.on.l3{background:var(--gold)} .pips i.on.l4{background:var(--ember)}

/* dsa */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .c{font-size:11.5px;opacity:.75;font-family:var(--f-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--ember-ink)}
.ptable{display:grid}
.pgroup{padding:16px 4px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ember);display:flex;gap:10px;align-items:center}
.pgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.prow{display:grid;grid-template-columns:42px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 8px;border-radius:11px;transition:background .15s}
.prow:hover{background:var(--surface-2)}
.prow .rk{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.prow .pn{min-width:0;cursor:pointer}
.prow .pn b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn b:hover{color:var(--ember)}
.prow .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.prow .acts{display:flex;align-items:center;gap:6px}
.prow.due .rk{color:var(--ember);font-weight:800}
.lc-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.lc-btn:hover{border-color:var(--gold);color:var(--gold)}
.lc-btn svg{width:14px;height:14px}
@media (max-width:640px){
  .prow{grid-template-columns:30px minmax(0,1fr) auto;row-gap:8px}
  .prow .acts{grid-column:2/-1;justify-content:flex-start}
  .prow .rcell{grid-row:1;grid-column:3}
  .prow .pn b{white-space:normal;overflow:visible}
  .prow .pips{display:none}
}
.catbars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px}
.catbar{display:grid;gap:4px;font-size:12.5px;cursor:pointer;border:0;background:none;text-align:left;padding:2px}
.catbar .top{display:flex;justify-content:space-between;gap:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,6,12,.45);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4);animation:slide .28s cubic-bezier(.2,.8,.2,1);display:grid;gap:14px;align-content:start}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@media (max-width:640px){.drawer{top:auto;height:92%;width:100%;border-radius:20px 20px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}@keyframes up{from{transform:translateY(60px);opacity:0}}}
.drawer h2{font-family:var(--f-display);font-size:22px;line-height:1.2}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12px;font-family:var(--f-mono)}
.hist button.h{border-color:var(--gold);color:var(--gold)}
.ref{border:1.5px dashed var(--line);border-radius:12px;padding:12px;font-size:13.5px}
.cx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx input{font-family:var(--f-mono)}

.jgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
@media (max-width:980px){.jgrid{grid-template-columns:minmax(0,1fr)}}
/* projects */
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ptile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:8px;transition:border-color .15s,transform .15s}
.ptile:hover{transform:translateY(-2px)}
.ptile[aria-pressed="true"]{border-color:var(--ember);box-shadow:var(--ring)}
.ptile .pnm{font-weight:800;font-size:14.5px;line-height:1.2}
.ptile .ptg{font-size:12px;color:var(--muted)}
.stack{display:flex;gap:5px;flex-wrap:wrap}
.log{display:grid;gap:2px}
.logi{display:grid;grid-template-columns:86px auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 4px;border-top:1px solid var(--line);font-size:14px}
.logi:first-child{border-top:0}
.logi .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.logi .x{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px}
.logi:hover .x,.logi .x:focus-visible{opacity:1}
@media (max-width:560px){.logi{grid-template-columns:auto minmax(0,1fr) auto}.logi .d{grid-column:1/-1}}
.addbar{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px}
@media (max-width:560px){.addbar{grid-template-columns:minmax(0,1fr) auto}.addbar select{grid-column:1/-1}}

/* jobs */
.jadd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) auto minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:860px){.jadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.jadd .wide{grid-column:1/-1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 11px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.funnel{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fstep{padding:10px;border-radius:12px;background:var(--surface-2);text-align:left;border:1px solid transparent}
.fstep[aria-pressed="true"]{border-color:var(--ember)}
.fstep b{font-family:var(--f-display);font-size:22px;display:block}
.fstep span{font-size:12px;color:var(--muted)}
.jt{width:100%;border-collapse:collapse;font-size:14px}
.jt th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.jt td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.jt tr:hover td{background:var(--surface-2)}
.jt select{padding:5px 8px;font-size:13px;font-weight:650;width:auto}
.jt .co{font-weight:750}
.jt .ro{font-size:12.5px;color:var(--muted)}
.st-wish{color:var(--muted)} .st-applied{color:var(--sky)} .st-oa{color:var(--gold)} .st-int{color:var(--ember)} .st-offer{color:var(--mint)} .st-rej{color:var(--rose)} .st-ghost{color:var(--muted)}
.tscroll{overflow-x:auto;margin:0 -6px;padding:0 6px}

/* panel + toast */
.panel{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(420px,calc(100% - 32px));max-height:calc(100% - 90px);overflow-y:auto;z-index:41;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(-8px) scale(.98);opacity:0}}
.nudge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px;border-radius:12px;background:var(--surface-2);font-size:13.5px;text-align:left;border:0;width:100%}
.nudge i{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--c,var(--ember))}
.nudge b{display:block}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
@media (max-width:900px){.toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:650;font-size:14px;box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.9,.3,1.3);max-width:100%;pointer-events:auto}
.toast.big{background:linear-gradient(90deg,var(--ember),var(--ember-2));color:var(--ember-ink);font-family:var(--f-display);font-size:15px;padding:14px 20px}
.xpfloat{position:fixed;z-index:70;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ember);text-shadow:0 1px 0 var(--surface);animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:65;width:100%;height:100%}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--line);font-size:12px}
.badge .bi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.badge .bi svg{width:22px;height:22px}
.badge b{font-size:12.5px;line-height:1.2}
.badge span{color:var(--muted);font-size:11px;line-height:1.3}
.badge.on .bi{background:linear-gradient(135deg,var(--ember),var(--gold));color:#1A0E08}
.badge:not(.on){opacity:.62}

.wkstrip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
@media (max-width:560px){.wkstrip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.wks{display:grid;gap:4px;justify-items:center;padding:8px 2px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font-size:11px;color:var(--muted)}
.wks b{font-family:var(--f-display);font-size:15px;color:var(--fg)}
.wks.now{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,var(--surface))}
.wks.done b{color:var(--mint)}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,6,12,.55)}
.modal .card{width:min(480px,100%);display:grid;gap:14px;box-shadow:var(--shadow)}
.modal h2{font-family:var(--f-display);font-size:22px}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--mint)} .sync.busy i{background:var(--gold)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

const Sync={mode:'local',last:null,db:null,uid:null,state:'local',fns:new Set(),timers:{},inflight:{},pending:{},
  set(s){this.state=s;this.fns.forEach(f=>f(s))},
  async init(apply,getLocal){
    this.apply=apply;this.getLocal=getLocal;if(Gist.cfg())return this.gInit();
    if(!window.claude||typeof window.claude.use!=='function')return;
    try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;const uid=await user.id();if(!uid)return;
      this.db=db;this.uid=uid;await this.pull(apply,getLocal);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.pull(apply,getLocal)});
    }catch(e){}},
  ref(k){return this.db.collection('data/users/'+this.uid).doc(k)},
  async pull(apply,getLocal){
    if(!this.db)return;this.set('busy');
    try{for(const k of DOCS){
        if(this.timers[k]||this.inflight[k])continue;
        const snap=await this.ref(k).get();const remote=snap.exists?snap.data():null;const local=getLocal()[k];
        const rt=(remote&&remote._t)||0,lt=(local&&local._t)||0;
        if(remote&&(rt>lt||FRESH.has(k)))apply(k,clone(remote));else if(lt>rt)this.push(k,local,0);}
      FRESH.clear();this.set('cloud');
    }catch(e){this.set(e&&e.code==='invalid_argument'?'local':'cloud')}},
  gInit(){this.mode='gist';this.gSync();
    if(!this.gIv){this.gIv=setInterval(()=>{if(document.visibilityState==='visible'&&this.mode==='gist'&&!this.gT)this.gSync()},60000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&this.mode==='gist'&&!this.gT)this.gSync()})}},
  gStop(){this.mode='local';clearTimeout(this.gT);this.gT=null;this.set('local')},
  async gSync(){if(this.mode!=='gist')return;if(this.gBusy){this.gAgain=true;return}this.gBusy=true;this.set('busy');
    try{const remote=await Gist.read()||{};const local=this.getLocal();const merged={};let push=false;
      for(const k of DOCS){const r=remote[k],l=local[k];const rt=(r&&r._t)||0,lt=(l&&l._t)||0;
        if(r&&(rt>lt||FRESH.has(k))){this.apply(k,clone(r));merged[k]=r}else{merged[k]=l;if(lt>rt)push=true}}
      FRESH.clear();if(push)await Gist.write(merged);this.last=new Date();this.set('gist')}
    catch(e){this.set(e&&(e.status===401||e.status===404)?'gist-error':'gist-offline')}
    finally{this.gBusy=false;if(this.gAgain){this.gAgain=false;this.gSync()}}},
  push(k,data,delay=1500){if(this.mode==='gist'){clearTimeout(this.gT);this.gT=setTimeout(()=>{this.gT=null;this.gSync()},2000);return}if(!this.db)return;this.pending[k]=data;clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(()=>{this.timers[k]=null;this.flush(k)},delay)},
  async flush(k){
    if(this.inflight[k]||!this.pending[k])return;const data=this.pending[k];this.pending[k]=null;
    this.inflight[k]=true;this.set('busy');let retry=false;
    try{await this.ref(k).set(data);this.set('cloud')}
    catch(e){if(e&&e.code==='unavailable'){retry=true;this.pending[k]=this.pending[k]||data;setTimeout(()=>this.flush(k),2500+Math.random()*1500)}else this.set('local')}
    finally{this.inflight[k]=false;if(this.pending[k]&&!retry)this.flush(k)}}
};

  if(!x&&e&&e.currentTarget&&e.currentTarget.getBoundingClientRect){const r=e.currentTarget.getBoundingClientRect();x=r.left+r.width/2;y=r.top}
  if(!x){x=innerWidth/2;y=innerHeight/2}
  const el=document.createElement('div');el.className='xpfloat';el.textContent='+'+n+' XP';el.style.left=x+'px';el.style.top=(y-14)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}
function burst(x=innerWidth/2,y=innerHeight/3,n=110){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.getElementById('fx');if(!cv)return;const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FF6A2B','#FFC23D','#3AD6A6','#7FA4FF','#FF7178'];
  const ps=Array.from({length:n},()=>{const a=Math.random()*Math.PI*2,s=Math.random()*9+4;return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*5+3,c:cols[Math.random()*5|0],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1}});
  const step=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);let alive=0;
    for(const p of ps){if(p.life<=0)continue;alive++;p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.011;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()}
    if(alive)requestAnimationFrame(step);else ctx.clearRect(0,0,innerWidth,innerHeight)};
  step()}

/* ---------- derived ---------- */
const solvesOf=(S,id)=>(S.dsa.p[id]&&S.dsa.p[id].s)||[];
const sDate=s=>s.slice(0,10);
function nextDue(sv){if(!sv.length)return null;return addDays(sDate(sv[sv.length-1]),INTERVALS[Math.min(sv.length-1,5)])}
const mastery=n=>n>=10?['Legend','l4']:n>=5?['Mastered','l3']:n>=3?['Strong','l2']:n>=1?['Learning','']:['New',''];
const xpOf=id=>{if(id[0]==='w'){const t=id.split('.')[1];return XP[t[0]]||10}if(id[0]==='g')return 50;if(id[0]==='p')return 30;return 15};
const levelOf=xp=>{let L=1;while(xp>=50*L*(L+1))L++;return{L,from:50*(L-1)*L,to:50*L*(L+1)}};
const titleOf=L=>TITLES.filter(t=>L>=t[0]).pop()[1];
const weekRange=(S,n)=>{const a=addDays(S.core.meta.start,(n-1)*7);return[a,addDays(a,6)]};
const inRange=(d,[a,b])=>d>=a&&d<=b;
function weekItems(w){const it=[];
  w.learn.forEach((l,i)=>it.push({id:`w${w.n}.l${i}`,l,t:'l'}));w.build.forEach((l,i)=>it.push({id:`w${w.n}.b${i}`,l,t:'b'}));
  w.dsa.forEach((l,i)=>it.push({id:`w${w.n}.d${i}`,l,t:'d'}));w.career.forEach((l,i)=>it.push({id:`w${w.n}.c${i}`,l,t:'c'}));
  w.deliver.forEach((l,i)=>it.push({id:`w${w.n}.x${i}`,l,t:'x',apps:/Apply to/.test(l)}));REPS.forEach((l,i)=>it.push({id:`w${w.n}.r${i}`,l,t:'r'}));return it}

function derive(S){
  const t=today(),C=S.core.checks;let xp=0;const days=new Set();
  for(const id in C){xp+=xpOf(id);days.add(C[id])}
  for(const d in S.core.daily){const n=(S.core.daily[d]||[]).length;xp+=n*10;if(n)days.add(d)}
  let solved=0,reps=0,mastered=0,due=[];const allSolves=[];
  for(const p of PROBLEMS){const sv=solvesOf(S,p.id);if(!sv.length)continue;solved++;reps+=sv.length;if(sv.length>=5)mastered++;
    xp+=sv.length*15+15;sv.forEach(s=>{days.add(sDate(s));allSolves.push(sDate(s))});
    const n=S.notes.p[p.id];if(n&&n.tc&&n.sc&&n.lg)xp+=10;const nd=nextDue(sv);if(nd<=t)due.push({id:p.id,nd})}
  due.sort((a,b)=>a.nd<b.nd?-1:1);
  let logs=0;for(const k in S.proj.p){(S.proj.p[k].log||[]).forEach(l=>{xp+=20;logs++;days.add(l.d)})}
  const jobs=S.jobs.list;const bonus={oa:15,int:40,offer:200};
  jobs.forEach(j=>{if(j.st!=='wish'){xp+=10;days.add(j.d)}xp+=bonus[j.st]||0;if(j.u)days.add(j.u)});
  for(const w in S.core.reviews){if(Object.values(S.core.reviews[w]||{}).some(v=>v&&v.trim()))xp+=30}
  const weeks=WEEKS.map(w=>{const r=weekRange(S,w.n);const items=weekItems(w);
    const apps=jobs.filter(j=>j.st!=='wish'&&inRange(j.d,r)).length;const ws=allSolves.filter(d=>inRange(d,r)).length;
    const isDone=it=>!!C[it.id]||(it.apps&&apps>=8);
    const done=items.filter(isDone).length+(ws>=5?1:0);const total=items.length+1;
    const del=items.filter(i=>i.t==='x');const delDone=del.filter(isDone).length;const allDel=delDone===del.length;
    if(allDel)xp+=100;
    const pct=done/total;const stars=pct>=1?3:allDel?2:pct>=.34?1:0;
    return{n:w.n,range:r,items,done,total,pct,stars,apps,ws,delDone,delTotal:del.length,allDel,isDone,left:items.filter(i=>!isDone(i))}});
  // streaks
  let streak=0,d=t;const active=days.has(t);if(!active)d=addDays(t,-1);while(days.has(d)){streak++;d=addDays(d,-1)}
  const sorted=[...days].filter(Boolean).sort();let best=0,run=0,prev=null;for(const x of sorted){run=prev&&diff(prev,x)===1?run+1:1;best=Math.max(best,run);prev=x}
  const lv=levelOf(xp);
  const start=S.core.meta.start;const dayNo=diff(start,t)+1;const cur=Math.min(10,Math.max(1,Math.ceil(dayNo/7)));
  const applied=jobs.filter(j=>j.st!=='wish');
  const followUps=jobs.filter(j=>j.st==='applied'&&diff(j.u||j.d,t)>=7);
  return{xp,lv,title:titleOf(lv.L),streak,best,active,solved,reps,mastered,due,logs,weeks,dayNo,cur,applied,followUps,days,
    interviews:jobs.filter(j=>['int','offer'].includes(j.st)).length,offers:jobs.filter(j=>j.st==='offer').length}}

  const coreU=[...new Set(SHEETS.core.flatMap(g=>g.items.map(x=>x[0])))];const sc=id=>solvesOf(S,id).length;

function nudges(S,D){
  const t=today(),out=[];const W=D.weeks[D.cur-1];const dl=diff(t,W.range[1]);const started=D.dayNo>=1;
  if(!started)out.push({c:'var(--sky)',h:`Your 10 weeks start ${fmt(S.core.meta.start)}`,b:'Warm up on the Core sheet until then.',go:'dsa'});
  else if(D.dayNo>70)out.push({c:'var(--mint)',h:'All 10 weeks are behind you',b:'Review what shipped and plan the next month.',go:'journey'});
  else{const ld=W.delTotal-W.delDone;if(W.left.length)out.push({c:dl<=2&&ld?'var(--rose)':'var(--ember)',h:`Week ${W.n}: ${W.left.length} task${W.left.length>1?'s':''} left, ${dl<=0?'last day':dl+' day'+(dl>1?'s':'')+' to go'}`,b:ld?`${ld} deliverable${ld>1?'s':''} still open: ${W.items.filter(i=>i.t==='x'&&!W.isDone(i)).map(i=>i.l).join(' · ')}`:'All deliverables done. Clean up the rest.',go:'week-'+W.n})}
  const q=(isWeekend(t)?DAY_PLAN.weekend:DAY_PLAN.weekday).filter(x=>!(S.core.daily[t]||[]).includes(x.k));
  if(q.length&&started&&D.dayNo<=70)out.push({c:'var(--gold)',h:`${q.length} block${q.length>1?'s':''} left in today's quest`,b:q.map(x=>`${x.l} (${x.m} min)`).join(' · '),go:'home'});
  if(!D.active&&D.streak>0)out.push({c:'var(--rose)',h:`Keep your ${D.streak}-day streak alive`,b:'Log anything today: one solve, one checkbox, one application.',go:'home'});
  if(D.due.length)out.push({c:'var(--mint)',h:`${D.due.length} problem${D.due.length>1?'s':''} due for re-solve`,b:D.due.slice(0,3).map(x=>PMAP[x.id].n).join(' · '),go:'dsa'});
  if(started&&D.dayNo<=70&&W.ws<5)out.push({c:'var(--mint)',h:`DSA this week: ${W.ws}/5 solves`,b:'Target 5–7 meaningful solves or re-solves, one of them timed.',go:'dsa'});
  if(started&&D.dayNo<=70&&W.apps<8)out.push({c:'var(--sky)',h:`Applications this week: ${W.apps}/8`,b:'Aim for 8–12 relevant applications.',go:'jobs'});
  if(D.followUps.length)out.push({c:'var(--sky)',h:`${D.followUps.length} follow-up${D.followUps.length>1?'s':''} due`,b:D.followUps.slice(0,3).map(j=>j.c).join(' · ')+' — applied 7+ days ago with no update.',go:'jobs'});
  const rv=S.core.reviews[W.n]||{};if(started&&D.dayNo<=70&&(dl<=1||isWeekend(t))&&!Object.values(rv).some(v=>v&&v.trim()))out.push({c:'var(--ember)',h:`Week ${W.n} review is waiting`,b:'Five short questions. Takes 10 minutes and sets up next week.',go:'week-'+W.n});
  return out}

function DText({value,onCommit,ph,rows=3,tag='textarea',id,cls,type}){

function Embers(){const ref=useRef();
  useEffect(()=>{const cv=ref.current;if(!cv)return;const ctx=cv.getContext('2d');let w=0,h=0,raf=0,alive=true;const ps=[];
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const size=()=>{const r=cv.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
    size();const ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(size):null;ro&&ro.observe(cv);
    const spawn=init=>({x:Math.random()*w,y:init?Math.random()*h:h+10,r:Math.random()*2+.6,vy:Math.random()*.55+.2,vx:(Math.random()-.5)*.3,a:Math.random()*.6+.35,hue:Math.random()<.7?20:40,ph:Math.random()*6});
    for(let i=0;i<64;i++)ps.push(spawn(true));
    const draw=()=>{ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';
      for(const p of ps){p.y-=p.vy;p.ph+=.02;p.x+=p.vx+Math.sin(p.ph)*.22;if(p.y<-10)Object.assign(p,spawn(false));const life=Math.max(0,Math.min(1,p.y/h));
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`hsla(${p.hue},100%,62%,${p.a*life+.04})`);g.addColorStop(1,'hsla(20,100%,50%,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,7);ctx.fill()}
      if(!reduce&&alive&&!document.hidden)raf=requestAnimationFrame(draw)};
    draw();const vis=()=>{cancelAnimationFrame(raf);if(!document.hidden&&!reduce&&alive)raf=requestAnimationFrame(draw)};
    document.addEventListener('visibilitychange',vis);
    return()=>{alive=false;cancelAnimationFrame(raf);ro&&ro.disconnect();document.removeEventListener('visibilitychange',vis)}},[]);
  return html`<canvas ref=${ref} aria-hidden="true"></canvas>`}

/* ---------- HOME ---------- */
function Home({S,D,A,go}){
  const t=today();const W=D.weeks[D.cur-1];const wk=WEEKS[D.cur-1];const C=S.core.checks;
  const plan=isWeekend(t)?DAY_PLAN.weekend:DAY_PLAN.weekday;const doneToday=S.core.daily[t]||[];
  const nextUnsolved=()=>{const cats=wk.cats;const pool=RANKED.filter(id=>!solvesOf(S,id).length);return pool.find(id=>cats.includes(PMAP[id].c))||pool[0]};
  const suggestDsa=D.due[0]?{id:D.due[0].id,why:'Due for re-solve'}:(nextUnsolved()?{id:nextUnsolved(),why:wk.cats.length?'Fits this week\'s topic':'Next by rank'}:null);
  const firstOpen=t2=>W.items.find(i=>i.t===t2&&!C[i.id]);
  const side=SIDE.slice(0,2).flatMap(s=>s.items.map((l,i)=>({id:`s.${s.id}.${i}`,l}))).find(x=>!C[x.id]);
  const sug=k=>{
    if(k==='dsa'&&suggestDsa){const p=PMAP[suggestDsa.id];return html`<span>${suggestDsa.why}: <a href="#" onClick=${e=>{e.preventDefault();e.stopPropagation();A.openP(p.id)}}>${p.n}</a></span>`}
    if(k==='concept'){const x=firstOpen('l');return x?'Next: '+x.l:'All learning items done this week. Revise weak spots.'}
    if(k==='build'||k==='project'){const x=firstOpen('b')||firstOpen('c');return x?'Next: '+x.l:'Build items done. Polish, test or write the README.'}
    if(k==='interview')return side?'Next: '+side.l:'Practice one design aloud.';
    if(k==='career')return `Applications this week: ${W.apps}/8`;return ''};
  const N=D.dayNo;const before=N<1,after=N>70;

/* ---------- JOURNEY ---------- */
function Journey({S,D,A}){
  const C=S.core.checks;const ROW=150,TOP=70;const pts=WEEKS.map((w,i)=>({x:50+30*Math.sin(i*.9),y:TOP+i*ROW}));const H=TOP+9*ROW+110;
  const path=pts.map((p,i)=>i?`C ${pts[i-1].x} ${pts[i-1].y+ROW/2} ${p.x} ${p.y-ROW/2} ${p.x} ${p.y}`:`M ${p.x} ${p.y}`).join(' ');
  const reached=Math.max(0,Math.min(9,D.cur-1));const prog=pts.slice(0,reached+1).map((p,i)=>i?`C ${pts[i-1].x} ${pts[i-1].y+ROW/2} ${p.x} ${p.y-ROW/2} ${p.x} ${p.y}`:`M ${p.x} ${p.y}`).join(' ');
  return html`<div class="wrap">

    <div class="grid jgrid">
      <section class="card" style=${{padding:'10px'}}>
        <div class="trail" style=${{height:H+'px'}}>
          <svg viewBox=${`0 0 100 ${H}`} preserveAspectRatio="none" aria-hidden="true">
            <path d=${path} fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round" vector-effect="non-scaling-stroke" stroke-dasharray="2 16"/>
            <path d=${prog} fill="none" stroke="var(--ember)" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          </svg>
          ${WEEKS.map((w,i)=>{const d=D.weeks[i];const now=w.n===D.cur&&D.dayNo>=1&&D.dayNo<=70;const cls='node'+(d.allDel?' done':'')+(now?' now':'');const r=40,c=2*Math.PI*r;
            return html`<a class=${cls} href=${'#week-'+w.n} style=${{left:pts[i].x+'%',top:pts[i].y+'px'}}>
              <span class="orb">${w.n}<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r=${r+4} fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray=${2*Math.PI*(r+4)} stroke-dashoffset=${2*Math.PI*(r+4)*(1-d.pct)}/></svg></span>
              <span class="nt">${w.title}</span><${Stars} n=${d.stars}/><span class="nd">${fmt(d.range[0])} · ${Math.round(d.pct*100)}%</span></a>`})}
        </div>
      </section>
      <div style=${{display:'grid',gap:'16px'}}>
        ${SIDE.map(s=>{const done=s.items.filter((_,i)=>C[`s.${s.id}.${i}`]).length;return html`<section class="card">
          <div class="card-h"><h3 class="grow">${s.title}</h3><span class=${'pill '+(done===s.items.length?'mint':'')}>${done}/${s.items.length}</span></div>
          <${Bar} pct=${done/s.items.length} tone=${s.id==='win'?'gold':'sky'}/>
          <div style=${{marginTop:'8px'}}>${s.items.map((l,i)=>html`<${Check} id=${`s.${s.id}.${i}`} label=${l} on=${!!C[`s.${s.id}.${i}`]} onToggle=${A.toggle} color=${s.id==='win'?'var(--gold)':'var(--sky)'} xp=${15}/>`)}</div></section>`})}

/* ---------- WEEK ---------- */

/* ---------- DSA ---------- */
function Dsa({S,D,A,ui,setUi}){
  const {tab='master',cat='',q='',st='all',pr=''}=ui;const set=o=>setUi({...ui,...o});
  const sc=id=>solvesOf(S,id).length;const dueSet=new Set(D.due.map(x=>x.id));
  const match=id=>{const p=PMAP[id];const n=sc(id);
    if(cat&&p.c!==cat)return false;if(q&&!(p.n+' '+p.p+' '+p.t).toLowerCase().includes(q.toLowerCase()))return false;
    if(st==='new'&&n)return false;if(st==='learning'&&!(n>=1&&n<3))return false;if(st==='strong'&&!(n>=3&&n<5))return false;if(st==='mastered'&&n<5)return false;if(st==='weak'&&!(S.dsa.p[id]&&S.dsa.p[id].w))return false;
    if(pr&&tab==='amz'){const a=AMZ_OF(id);if(!a||a.x.pr!==pr)return false}return true};
  let groups;
  if(tab==='master')groups=[{label:'Ranked by how many of your sheets include it, then Amazon priority and Infosys block',items:RANKED.map(id=>[id,RANK[id]])}];
  else if(tab==='due')groups=[{label:'Spaced repetition: 1 → 3 → 7 → 14 → 30 → 60 days',items:D.due.map((x,i)=>[x.id,i+1])}];
  else groups=SHEETS[tab];
  const shown=groups.map(g=>({...g,items:g.items.filter(([id])=>match(id))})).filter(g=>g.items.length);
  const count=shown.reduce((a,g)=>a+g.items.length,0);
  const catStats=Object.keys(CATS).map(k=>{const ps=PROBLEMS.filter(p=>p.c===k);return{k,l:CATS[k],t:ps.length,s:ps.filter(p=>sc(p.id)).length}}).filter(c=>c.t);
  const tabs=[['master','Master',PROBLEMS.length],['core','Core 70',70],['inf','Infosys 40',40],['amz','Amazon 45',45],['due','Revision due',D.due.length]];
  return html`<div class="wrap">
    <div class="row" style=${{justifyContent:'space-between',alignItems:'flex-end'}}>
      <div><div class="eyebrow">DSA arena · Java</div><h2 style=${{fontFamily:'var(--f-display)',fontSize:'clamp(24px,3.4vw,34px)',marginTop:'4px'}}>Every rep counts</h2></div>
      <div class="row" style=${{gap:'8px'}}>
        <span class="pill mint">${D.solved}/${PROBLEMS.length} solved</span><span class="pill gold">${D.reps} total reps</span><span class="pill ember">${D.mastered} mastered (5+)</span></div></div>
    <section class="card">
      <div class="card-h"><h3 class="grow">Pattern coverage</h3><span class="muted" style=${{fontSize:'12px'}}>Tap a pattern to filter</span></div>
      <div class="catbars">${catStats.map(c=>html`<button class="catbar" aria-pressed=${cat===c.k?'true':'false'} onClick=${()=>set({cat:cat===c.k?'':c.k})}><span class="top"><span style=${{fontWeight:cat===c.k?800:600,color:cat===c.k?'var(--ember)':''}}>${c.l}</span><span class="mono muted">${c.s}/${c.t}</span></span><${Bar} pct=${c.s/c.t} tone=${c.s===c.t?'mint':''}/></button>`)}</div>
    </section>
    <section class="card">
      <div class="tabs" role="tablist">${tabs.map(([k,l,c])=>html`<button class="tab" role="tab" aria-selected=${tab===k?'true':'false'} onClick=${()=>set({tab:k,pr:''})}>${l}<span class="c">${c}</span></button>`)}</div>
      <div class="row" style=${{marginTop:'12px'}}>
        <input type="search" id="dsa-q" placeholder="Search problem, pattern or topic" value=${q} onInput=${e=>set({q:e.target.value})} style=${{flex:'1 1 220px',width:'auto'}}/>
        <div class="chips">${[['all','All'],['new','New'],['learning','1–2 reps'],['strong','3–4'],['mastered','5+'],['weak','Flagged weak']].map(([k,l])=>html`<button class="chip" aria-pressed=${st===k?'true':'false'} onClick=${()=>set({st:k})}>${l}</button>`)}</div>
      </div>
      ${tab==='amz'?html`<div class="chips" style=${{marginTop:'8px'}}>${['','P0','P1','P2'].map(k=>html`<button class="chip" aria-pressed=${pr===k?'true':'false'} onClick=${()=>set({pr:k})}>${k||'All priorities'}</button>`)}</div>`:null}

function gcal(S,{title,details,days,time,mins}){
  const end=addDays(S.core.meta.start,69);const base=today()>S.core.meta.start?today():S.core.meta.start;
  const map={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};const want=days.split(',').map(d=>map[d]);let d=base;for(let i=0;i<7&&!want.includes(parse(d).getDay());i++)d=addDays(d,1);
  const [h,m]=time.split(':').map(Number);const e=new Date(parse(d));e.setHours(h,m+mins);
  const st=d.replace(/-/g,'')+'T'+pad(h)+pad(m)+'00',en=ds(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(x){}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&details='+encodeURIComponent(details)+'&dates='+st+'/'+en+(tz?'&ctz='+encodeURIComponent(tz):'')+'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY='+days+';UNTIL='+end.replace(/-/g,'')+'T235959Z')}

  const inClaude=!!(window.claude&&typeof window.claude.use==='function');
  if(inClaude&&!g)return html`<div class=${'sync '+(sync==='cloud'?'cloud':sync==='busy'?'busy':'')}><i></i>${sync==='cloud'?'Synced to your Claude account (open it on any device)':sync==='busy'?'Syncing…':'Saved in this browser'}</div>`;
  const t=Sync.last?Sync.last.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}):'';
  if(g)return html`<div style=${{display:'grid',gap:'8px'}}><div class="eyebrow">Sync across devices</div>
    <div class=${'sync '+(sync==='gist'?'cloud':sync==='busy'?'busy':'')}><i></i>${sync==='gist'?`Synced with GitHub as @${g.login}${t?' · '+t:''}`:sync==='busy'?'Syncing with GitHub…':sync==='gist-error'?'Sync stopped: the token was revoked or the gist was deleted. Disconnect and connect again.':'Offline. Changes are saved here and sync when you are back online.'}</div>
    <div class="row"><button class="btn sm" onClick=${()=>Sync.gSync()}>Sync now</button><button class="btn sm danger" onClick=${A.disconnectGist}>Disconnect this device</button></div></div>`;
  return html`<div style=${{display:'grid',gap:'8px'}}><div class="eyebrow">Sync across devices</div>
    <p class="muted" style=${{margin:0,fontSize:'13px'}}>Progress is saved in a secret gist in your GitHub account. Create a token with only the <b>gist</b> permission, then paste the same token on each laptop and phone.</p>
    <a class="btn sm" style=${{justifySelf:'start'}} href="https://github.com/settings/tokens/new?scopes=gist&description=Career%20Forge%20sync" target="_blank" rel="noopener">Create token on GitHub ${I.ext}</a>
    <form class="row" style=${{flexWrap:'nowrap'}} onSubmit=${async e=>{e.preventDefault();if(!tok.trim())return;setBusy(true);await A.connectGist(tok.trim());setBusy(false);setTok('')}}>
      <input type="password" id="gtok" autocomplete="off" placeholder="ghp_…" value=${tok} onInput=${e=>setTok(e.target.value)} aria-label="GitHub token"/>
      <button class="btn sm primary" type="submit" disabled=${busy||!tok.trim()}>${busy?'Connecting…':'Connect'}</button></form></div>`}

function Settings({S,A,close,sync}){
  const m=S.core.meta;const [confirm,setConfirm]=useState(false);const fileRef=useRef();
  return html`<div class="modal" onClick=${e=>e.target===e.currentTarget&&close()}><div class="card pad-lg" role="dialog" aria-label="Settings">
    <div class="row" style=${{justifyContent:'space-between'}}><h2>Settings</h2><button class="icon-btn" aria-label="Close" onClick=${close}>${I.x}</button></div>
    <label class="field" for="nm">Your name<input type="text" id="nm" value=${m.name} onChange=${e=>A.meta({name:e.target.value.trim()})} placeholder="Shown in the greeting"/></label>
    <label class="field" for="sd">Week 1 starts on<input type="date" id="sd" value=${m.start} onChange=${e=>e.target.value&&A.meta({start:e.target.value})}/></label>
    <div class="field">Theme<span class="seg">${[['auto','System'],['light','Light'],['dark','Dark']].map(([k,l])=>html`<button type="button" aria-pressed=${m.theme===k?'true':'false'} onClick=${()=>A.meta({theme:k})}>${l}</button>`)}</span></div>
    <${SyncBox} sync=${sync} A=${A}/>
    <div class="row"><button class="btn sm" onClick=${A.exportData}>${I.down} Export backup</button><button class="btn sm" onClick=${()=>fileRef.current.click()}>${I.up} Import backup</button>
      <input ref=${fileRef} type="file" accept="application/json,.json" class="sr" id="imp" onChange=${e=>{const f=e.target.files[0];if(f)A.importData(f);e.target.value=''}}/></div>
    <div style=${{borderTop:'1px solid var(--line)',paddingTop:'12px'}}>${confirm?html`<div class="row"><span class="muted">Erase every tick, solve, log and application?</span><button class="btn sm danger" onClick=${()=>{A.reset();setConfirm(false);close()}}>Erase everything</button><button class="btn sm" onClick=${()=>setConfirm(false)}>Cancel</button></div>`:html`<button class="btn sm danger" onClick=${()=>setConfirm(true)}>Reset all progress…</button>`}</div>
  </div></div>`}

function Onboard({S,A}){const [n,setN]=useState(S.core.meta.name||'');const [d,setD]=useState(S.core.meta.start);
  return html`<div class="modal"><form class="card pad-lg" onSubmit=${e=>{e.preventDefault();A.meta({name:n.trim(),start:d||S.core.meta.start,onboarded:true});burst();toast('Let\'s go. Week 1 is live.',true)}}>
    <div class="eyebrow">Career Forge</div><h2>Seventy days. Three projects. One new job.</h2>
    <p class="muted" style=${{margin:0}}>Your roadmap, all four DSA sheets and the trackers are loaded. Two quick details and you're in.</p>
    <label class="field" for="on-n">What should I call you?<input type="text" id="on-n" value=${n} onInput=${e=>setN(e.target.value)} placeholder="Optional"/></label>
    <label class="field" for="on-d">Week 1 starts on<input type="date" id="on-d" value=${d} onInput=${e=>setD(e.target.value)}/></label>
    <button class="btn primary" type="submit">Light it up ${I.flame}</button></form></div>`}

/* ---------- APP ---------- */
const NAV=[['home','Home',I.flame],['journey','Journey',I.map],['dsa','DSA',I.code],['projects','Projects',I.layers],['jobs','Jobs',I.brief]];
const readRoute=()=>{const h=(location.hash||'').slice(1);if(/^week-(10|[1-9])$/.test(h))return h;return NAV.some(n=>n[0]===h)?h:'home'};
const uiGet=()=>{try{return JSON.parse(localStorage.getItem(LS+'ui'))||{}}catch(e){return{}}};

function App(){
  const [S,setS]=useState(loadAll);const [route,setRoute]=useState(readRoute);const [pid,setPid]=useState(null);
  const [panel,setPanel]=useState(null);const [sync,setSync]=useState(Sync.state);const [toasts,setToasts]=useState([]);const [ui,setUiS]=useState(uiGet);
  const Sref=useRef(S);Sref.current=S;const quiet=useRef(Date.now()+1500);
  const setUi=u=>{setUiS(u);try{localStorage.setItem(LS+'ui',JSON.stringify(u))}catch(e){}};
  useEffect(()=>{const f=()=>{setRoute(readRoute());window.scrollTo({top:0})};addEventListener('hashchange',f);Toasts.fns.add(setToasts);Sync.fns.add(setSync);
    Sync.init((k,v)=>{quiet.current=Date.now()+2500;lsSet(k,v);Sref.current={...Sref.current,[k]:{...blank()[k],...v}};setS(p=>({...p,[k]:{...blank()[k],...v}}))},()=>Sref.current);
    return()=>{removeEventListener('hashchange',f);Toasts.fns.delete(setToasts)}},[]);
  // theme
  useEffect(()=>{const th=S.core.meta.theme;const r=document.documentElement;if(th==='light'||th==='dark'){r.setAttribute('data-theme',th);r.dataset.own='1'}else if(r.dataset.own){r.removeAttribute('data-theme');delete r.dataset.own}},[S.core.meta.theme]);
  const D=useMemo(()=>derive(S),[S]);
  // celebrations
  const prev=useRef(null);
  useEffect(()=>{const cur={L:D.lv.L,w:D.weeks.map(w=>w.allDel),b:badges(S,D).map(b=>b[2])};const p=prev.current;prev.current=cur;if(!p||Date.now()<quiet.current)return;
    if(cur.L>p.L){burst();toast(`Level ${cur.L} · ${titleOf(cur.L)}!`,true)}
    cur.w.forEach((v,i)=>{if(v&&!p.w[i]){burst(innerWidth/2,innerHeight/2,160);toast(`Week ${i+1} boss defeated. +100 XP`,true)}});
    const bs=badges(S,D);cur.b.forEach((v,i)=>{if(v&&!p.b[i])setTimeout(()=>toast('Achievement unlocked: '+bs[i][0],true),400)})},[D]);
  // desktop reminder while open
  useEffect(()=>{const tick=()=>{const m=Sref.current.core.meta;if(!m.notif||typeof Notification==='undefined'||Notification.permission!=='granted')return;
      const now=new Date();const [h,mi]=(m.remind||'20:00').split(':').map(Number);let last='';try{last=localStorage.getItem(LS+'notified')||''}catch(e){}
      if(last!==today()&&(now.getHours()>h||(now.getHours()===h&&now.getMinutes()>=mi))){const ns=nudges(Sref.current,derive(Sref.current));
        try{new Notification('Career Forge',{body:ns.length?ns.slice(0,2).map(n=>n.h).join(' · '):'Nice work today. Keep the streak going.'})}catch(e){}
        try{localStorage.setItem(LS+'notified',today())}catch(e){}}};
    tick();const iv=setInterval(tick,60000);return()=>clearInterval(iv)},[]);

  const mut=(k,fn)=>setS(p=>{const d=clone(p[k]);fn(d);d._t=Date.now();lsSet(k,d);Sync.push(k,d);return{...p,[k]:d}});
  const A={
    toggle:(id,e)=>{const on=!!Sref.current.core.checks[id];if(!on)floatXP(e,xpOf(id));mut('core',d=>{if(on)delete d.checks[id];else d.checks[id]=today()})},
    daily:(k,e)=>{const t=today();const on=(Sref.current.core.daily[t]||[]).includes(k);if(!on)floatXP(e,10);mut('core',d=>{const a=d.daily[t]||[];d.daily[t]=on?a.filter(x=>x!==k):[...a,k]})},
    solve:(id,e)=>{const n=solvesOf(Sref.current,id).length;floatXP(e,n?15:30);mut('dsa',d=>{const r=d.p[id]=d.p[id]||{s:[]};r.s=[...(r.s||[]),today()]});
      const m={3:'Strong: 3 reps.',5:'Mastered: 5 reps.',10:'Legend: 10 reps!'}[n+1];if(m)toast(PMAP[id].n+' · '+m,n+1>=5)},
    unsolve:id=>mut('dsa',d=>{const r=d.p[id];if(r&&r.s&&r.s.length){r.s=r.s.slice(0,-1)}}),
    hint:(id,i)=>mut('dsa',d=>{const r=d.p[id];if(!r)return;const s=r.s[i];r.s=[...r.s];r.s[i]=s.endsWith('*')?s.slice(0,-1):s+'*'}),
    flag:id=>mut('dsa',d=>{const r=d.p[id]=d.p[id]||{s:[]};if(r.w)delete r.w;else r.w=1}),
    note:(id,f,v)=>mut('notes',d=>{const r=d.p[id]=d.p[id]||{};if(v)r[f]=v;else delete r[f]}),
    review:(n,i,v)=>mut('core',d=>{const r=d.reviews[n]=d.reviews[n]||{};if(v)r[i]=v;else delete r[i]}),
    log:(pid2,k,t,e)=>{floatXP(e,20);mut('proj',d=>{const r=d.p[pid2]=d.p[pid2]||{};r.log=[...(r.log||[]),{id:Date.now().toString(36),d:today(),k,t}]})},
    unlog:(pid2,id)=>mut('proj',d=>{const r=d.p[pid2];if(r)r.log=(r.log||[]).filter(l=>l.id!==id)}),
    plink:(pid2,k,v)=>mut('proj',d=>{const r=d.p[pid2]=d.p[pid2]||{};r.links={...(r.links||{}),[k]:v}}),
    pbul:(pid2,v)=>mut('proj',d=>{const r=d.p[pid2]=d.p[pid2]||{};r.bullets=v}),
    addJob:(j,e)=>{floatXP(e,10);mut('jobs',d=>{d.list=[...d.list,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),st:'applied',d:today(),...j}]});toast(`${j.c} added. ${D.weeks[D.cur-1].apps+1} this week.`)},
    editJob:(id,patch,msg)=>{mut('jobs',d=>{d.list=d.list.map(j=>j.id===id?{...j,...patch}:j)});if(msg)toast(msg)},
    jobStatus:(id,st,e)=>{const b={oa:15,int:40,offer:200}[st];if(b)floatXP(e,b);if(st==='offer'){burst(innerWidth/2,innerHeight/2,220)}mut('jobs',d=>{d.list=d.list.map(j=>j.id===id?{...j,st,u:today()}:j)})},
    delJob:id=>mut('jobs',d=>{d.list=d.list.filter(j=>j.id!==id)}),
    meta:patch=>mut('core',d=>{d.meta={...d.meta,...patch}}),
    openP:id=>setPid(id),
    dsaCat:c=>setUi({...ui,cat:c||'',tab:'master'}),
    copy:txt=>{try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>toast('Copy blocked here. Select the text instead.'))}catch(e){toast('Copy blocked here. Select the text instead.')}},
    enableNotif:async()=>{if(typeof Notification==='undefined'){toast('Notifications are not available here. Use the calendar links.');return}
      try{const p=await Notification.requestPermission();if(p==='granted'){A.meta({notif:true});toast('Desktop alerts on at '+(Sref.current.core.meta.remind||'20:00'))}else toast('Notifications are blocked in this view. Use the calendar links.')}catch(e){toast('Notifications are blocked in this view. Use the calendar links.')}},
    exportData:async()=>{const data=JSON.stringify({app:'career-forge',v:1,exported:new Date().toISOString(),state:Sref.current});const name='career-forge-backup-'+today()+'.json';
      try{const dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:name,data});toast('Backup saved');return}}catch(e){if(e&&e.code==='declined')return}
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}catch(e){toast('Download blocked in this view')}},
    importData:f=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const st=j.state||j;if(!st.core||!st.dsa)throw 0;quiet.current=Date.now()+2500;
        setS(()=>{const b=blank();const n={};for(const k of DOCS){n[k]={...b[k],...(st[k]||{}),_t:Date.now()};lsSet(k,n[k]);Sync.push(k,n[k])}return n});toast('Backup restored')}catch(e){toast('That file is not a Career Forge backup')}};r.readAsText(f)},
    connectGist:async tok=>{try{const res=await Gist.connect(tok,Sref.current);
        if(res.joined){const remote=await Gist.read();if(remote)for(const k of DOCS)if(remote[k])Sync.apply(k,clone(remote[k]));toast(`Connected as @${res.login}. Progress loaded from GitHub.`,true)}
        else toast(`Connected as @${res.login}. Use the same token on your other devices.`,true);Sync.gInit()}
      catch(e){Gist.save(null);toast(e&&e.status===401?'GitHub rejected that token. Check it has the gist permission.':'Could not reach GitHub. Check your connection and try again.')}},
    disconnectGist:()=>{Gist.save(null);Sync.gStop();toast('This device stopped syncing. Your data stays here and in the gist.')},
    reset:()=>{quiet.current=Date.now()+2500;setS(()=>{const b=blank();const n={};for(const k of DOCS){n[k]={...b[k],_t:Date.now()};if(k==='core')n[k].meta={...n[k].meta,onboarded:true};lsSet(k,n[k]);Sync.push(k,n[k])}return n});toast('Progress erased. Fresh start.')}
  };
  const wk=route.startsWith('week-')?+route.slice(5):0;const navKey=wk?'journey':route;
  const lv=D.lv;const th=S.core.meta.theme;const nz=nudges(S,D).length;
  const view=wk?html`<${Week} n=${wk} S=${S} D=${D} A=${A}/>`:route==='journey'?html`<${Journey} S=${S} D=${D} A=${A}/>`:route==='dsa'?html`<${Dsa} S=${S} D=${D} A=${A} ui=${ui} setUi=${setUi}/>`:route==='projects'?html`<${Projects} S=${S} A=${A} ui=${ui} setUi=${setUi}/>`:route==='jobs'?html`<${Jobs} S=${S} D=${D} A=${A} ui=${ui} setUi=${setUi}/>`:html`<${Home} S=${S} D=${D} A=${A}/>`;
  const navLinks=NAV.map(([k,l,ic])=>html`<a class="nav-btn" href=${'#'+k} title=${l} aria-current=${navKey===k?'page':undefined}>${ic}<span>${l}</span>${k==='dsa'&&D.due.length?html`<b class="pill ember">${D.due.length}</b>`:null}</a>`);
  const xpPct=(D.xp-lv.from)/(lv.to-lv.from);
  return html`<div class="app">
    <header class="topnav">
      <div class="topnav-in">
        <a class="brand" href="#home" aria-label="Career Forge home"><span class="logo">${I.flame}</span><span><b>Career Forge</b><small>10 weeks · 70 days</small></span></a>
        <nav class="nav" aria-label="Main">${navLinks}</nav>
        <div class="tools">
          <span class="lvl" title=${`${D.xp-lv.from}/${lv.to-lv.from} XP to level ${lv.L+1}`}>LV ${lv.L}<span class="xptext num">${D.xp-lv.from}/${lv.to-lv.from} XP · ${D.title}</span></span>
          <span class=${'streak'+(D.active?' on':'')} title=${D.active?'Active today':'Do one thing today to keep the streak'}>${I.flame}<span class="num">${D.streak}</span></span>
          <button class="icon-btn" aria-label="Reminders" onClick=${()=>setPanel(panel==='bell'?null:'bell')}>${I.bell}${nz?html`<span class="dot">${nz}</span>`:null}</button>
          <button class="icon-btn" aria-label=${'Theme: '+th} title="Theme" onClick=${()=>A.meta({theme:th==='auto'?'light':th==='light'?'dark':'auto'})}>${th==='dark'?I.moon:th==='light'?I.sun:I.auto}</button>
          <button class="icon-btn" aria-label="Settings" onClick=${()=>setPanel('settings')}>${I.gear}</button>
        </div>
      </div>
      <div class="xpline" role="progressbar" aria-label="XP to next level" aria-valuenow=${Math.round(xpPct*100)} aria-valuemin="0" aria-valuemax="100"><i style=${{width:Math.round(Math.min(1,xpPct)*100)+'%'}}></i></div>
    </header>
    <main class="main">
      ${view}
    </main>
    <nav class="dock" aria-label="Main">${navLinks}</nav>
    ${pid?html`<${ProblemDrawer} key=${pid} id=${pid} S=${S} A=${A} close=${()=>setPid(null)}/>`:null}
    ${panel==='bell'?html`<${Bell} S=${S} D=${D} A=${A} close=${()=>setPanel(null)}/>`:null}
    ${panel==='settings'?html`<${Settings} S=${S} A=${A} sync=${sync} close=${()=>setPanel(null)}/>`:null}
    ${!S.core.meta.onboarded?html`<${Onboard} S=${S} A=${A}/>`:null}
    <div class="toasts" aria-live="polite">${toasts.map(t=>html`<div class=${'toast'+(t.big?' big':'')} key=${t.id}>${t.msg}</div>`)}</div>
  </div>`}

render(html`<${App}/>`,document.getElementById('root'));
</script>
</body></html>
